# .github/dependabot.yml
#
# Opens grouped PRs to keep dependencies and tool versions current. This pairs
# with the squash/rebase + required-review workflow: minor and patch bumps land
# as one batched PR per ecosystem, and majors come separately so they get their
# own review.

version: 2
updates:
  # Python dependencies (pyproject.toml + uv.lock). Uses the native uv
  # ecosystem so the lockfile is regenerated, not just pyproject.toml.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      python-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # pre-commit hook revisions in .pre-commit-config.yaml
  # (uv-lock pin + the hygiene hooks).
  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      pre-commit-all:
        patterns:
          - "*"

  # GitHub Actions referenced in .github/workflows. Actions are pinned by
  # commit SHA; Dependabot updates both the SHA and the trailing version
  # comment in one PR.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions-all:
        patterns:
          - "*"
